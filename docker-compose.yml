version: "3.9"

services:
  backend:
    build:
      context: ./backend
    image: civicpulse-backend:latest
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/civicpulse
      - REDIS_URL=redis://redis:6379
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
    image: civicpulse-frontend:latest
    ports:
      - "8080:80"
    depends_on:
      - backend

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: civicpulse
      POSTGRES_HOST_AUTH_METHOD=trust # dev only
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
