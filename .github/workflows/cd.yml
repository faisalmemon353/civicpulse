# .github/workflows/cd.yml
name: CD – Build, Push & Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Kubernetes Manifests
        uses: stefanprodan/kubeconform-action@v0.1.0
        with:
          k8s-version: "1.30.0"
          schema-locations: "default"
          ignore-missing-schemas: false
          files: "k8s/base/*.yaml"

  build-push:
    name: Build & Publish to GHCR
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/civicpulse-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/civicpulse-backend:latest

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/civicpulse-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/civicpulse-frontend:latest

  deploy:
    name: Ephemeral Kubernetes Deploy & Smoke Test
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Ephemeral Kind Cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: kind-civicpulse
          wait: 120s

      - name: Deploy Kubernetes Manifests
        run: |
          kubectl apply -k k8s/overlays/dev
          echo "Waiting on rollout status..."
          kubectl rollout status statefulset/postgres -n civicpulse --timeout=180s
          kubectl rollout status deployment/redis -n civicpulse --timeout=180s
          kubectl rollout status deployment/backend -n civicpulse --timeout=180s
          kubectl rollout status deployment/frontend -n civicpulse --timeout=180s

      - name: Smoke Test Ingress & Services
        run: |
          kubectl get all -n civicpulse
          kubectl get hpa -n civicpulse
          kubectl get ingress -n civicpulse
