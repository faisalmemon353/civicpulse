name: CI

'on':
  workflow_dispatch:

  pull_request:
    branches:
      - main
      - dev

  push:
    branches:
      - dev

permissions:
  contents: read

jobs:

  lint-and-type:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        working-directory: backend
        run: ruff check .

      - name: Mypy (type check)
        working-directory: backend
        run: mypy app/ || true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: frontend
        run: npm run lint


  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: lint-and-type

    env:
      DATABASE_URL: postgresql+psycopg://postgres:testpass@localhost:5432/civicpulse_test
      TRIAGE_PROVIDER: simulated
      REDIS_URL: redis://localhost:6379/0
      OPENROUTER_API_KEY: sk-or-placeholder

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: civicpulse_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run Alembic migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run tests with coverage
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=65 tests/


  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: lint-and-type

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest
        working-directory: frontend
        run: npm run test -- --run


  build:
    name: Build Images (no push)
    runs-on: ubuntu-latest
    needs:
      - test-backend
      - test-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t civicpulse-backend:ci -f backend/Dockerfile backend

      - name: Build frontend image
        run: docker build -t civicpulse-frontend:ci -f frontend/Dockerfile frontend


  scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t civicpulse-backend:ci -f backend/Dockerfile backend

      - name: Build frontend image
        run: docker build -t civicpulse-frontend:ci -f frontend/Dockerfile frontend

      - name: Trivy scan - backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: civicpulse-backend:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Trivy scan - frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: civicpulse-frontend:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true


  manifests:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Build manifests
        run: kustomize build k8s/overlays/prod > /tmp/manifests.yaml

      - name: Validate with kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          ./kubeconform -strict -summary /tmp/manifests.yaml
