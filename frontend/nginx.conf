server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Dynamic DNS resolver for Docker (127.0.0.11) and Kubernetes (10.96.0.10)
    resolver 127.0.0.11 10.96.0.10 valid=10s ipv6=off;

    # Serve static assets; fall back to index.html for SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API calls to the backend service
    location /api/ {
        set $backend_target "http://backend:8000";
        proxy_pass $backend_target;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Proxy health/ready/metrics endpoints
    location ~ ^/(health|ready|metrics)$ {
        set $backend_target "http://backend:8000";
        proxy_pass $backend_target;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }
}
